name = "aceLean"
version = "0.1.0"
defaultTargets = ["AceLean", "AceLeanTests", "AceLeanExamples", "AceLeanDiagnosticFixtures"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "AceLean"

[[lean_lib]]
name = "AceLeanTests"
roots = ["AceLean.Tests"]

[[lean_lib]]
name = "AceLeanExamples"
roots = ["examples.Mathematics", "examples.Audit"]

[[lean_lib]]
name = "AceLeanDiagnosticFixtures"
roots = ["AceLean.Tests.ImportLeft", "AceLean.Tests.ImportRight"]
